version: 2

updates:
  # Runtime dependencies are shipped to users, so security updates here matter most.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      # Biome 2.6 enables new recommended lint rules (style/useTemplate) that
      # fail on the legacy 0.4.x codebase; keeping it pinned to 2.5.x avoids a
      # cosmetic refactor of code that is frozen.
      - dependency-name: '@biomejs/biome'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(ci)'
