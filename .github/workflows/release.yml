name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run typecheck && npm run lint && npm test && npm run build
      - name: Tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Smoke test against BotConnector Cloud
        env:
          BOTCONNECTOR_API_KEY: ${{ secrets.BOTCONNECTOR_API_KEY }}
        run: scripts/smoke.sh
      - name: Publish
        run: |
          version=$(node -p "require('./package.json').version")
          tag=latest; case "$version" in *-*) tag=beta;; esac
          npm publish --provenance --access public --tag "$tag"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes $(case "$GITHUB_REF_NAME" in *-*) echo --prerelease;; esac)
