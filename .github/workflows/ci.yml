name: ci
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      # Build before the tests: test/mcpServeStdio.test.ts skips itself when dist/cli.js
      # is missing, so testing first would leave the bundle untested on a clean checkout.
      - run: npm run build
      - run: npm test
      - if: runner.os == 'Linux'
        run: BCCLI_E2E_MCP=1 npx vitest run test/e2e-mcp.test.ts
      # Smoke the built binary offline: the bundle, the completion output and two
      # subcommands that only read local state (hermetic BCCLI_HOME).
      - run: |
          node dist/cli.js --version
          node dist/cli.js completion bash > /dev/null
          BCCLI_HOME="$RUNNER_TEMP/bccli-smoke" node dist/cli.js mcp list
          BCCLI_HOME="$RUNNER_TEMP/bccli-smoke" node dist/cli.js stats
