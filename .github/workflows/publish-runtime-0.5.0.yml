  publish_054:
    name: Publish verified 0.5.4 archive via existing npm OIDC
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_version == '0.5.4' }}
    runs-on: ubuntu-latest
    environment: npm-production
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Retrieve immutable archive from verified source release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bccli-054-publish"
          gh release download bccli-v0.5.4 --repo farijarifriyanto-debug/bccli-runtime --dir "$RUNNER_TEMP/bccli-054-publish" --pattern 'botconnector-bccli-0.5.4.tgz' --pattern 'SHA256SUMS.txt'
          # The release was created with targetCommitish=product; resolve the
          # lightweight tag ref so the payload is pinned to one exact commit.
          test "$(gh api repos/farijarifriyanto-debug/bccli-runtime/git/ref/tags/bccli-v0.5.4 --jq .object.sha)" = '999fe7d6179954f45e9492c55a8384cd93a51737'
          cd "$RUNNER_TEMP/bccli-054-publish"
          sha256sum -c SHA256SUMS.txt
          actual="$(sha256sum botconnector-bccli-0.5.4.tgz | cut -d ' ' -f 1)"
          test "$actual" = '52702af547846044b9aa36d0f7be33816d3fd26cdcb05f8bb3bdd30b3d290da3'
          echo "PASS: byte-identical package from bccli-runtime commit 999fe7d"
      - name: Align npm repository provenance metadata with existing trusted publisher
        shell: bash
        run: |
          set -euo pipefail
          original="$RUNNER_TEMP/bccli-054-publish/botconnector-bccli-0.5.4.tgz"
          target="$RUNNER_TEMP/bccli-054-publish/botconnector-bccli-0.5.4-oidc.tgz"
          work="$RUNNER_TEMP/bccli-054-provenance"
          mkdir -p "$work/source" "$work/check" "$work/reference"
          tar -xzf "$original" -C "$work/reference"
          tar -xzf "$original" -C "$work/source"
          node --input-type=module - "$work/source/package/package.json" <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path=process.argv[2];
          const pkg=JSON.parse(readFileSync(path,'utf8'));
          if(pkg.name!=='@botconnector/bccli'||pkg.version!=='0.5.4')throw Error('Unexpected release');
          if(!String(pkg.repository?.url||'').includes('farijarifriyanto-debug/bccli-runtime.git'))throw Error('Original source repository differs');
          pkg.repository={type:'git',url:'git+https://github.com/farijarifriyanto-debug/bccli.git'};
          pkg.bccliRuntimeSource={
            repository:'https://github.com/farijarifriyanto-debug/bccli-runtime',
            commit:'999fe7d6179954f45e9492c55a8384cd93a51737',
            release:'bccli-v0.5.4',
            originalSha256:'52702af547846044b9aa36d0f7be33816d3fd26cdcb05f8bb3bdd30b3d290da3'
