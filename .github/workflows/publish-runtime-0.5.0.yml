name: Publish native BCCLI to npm latest

on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: "Type 0.5.1, 0.5.2, 0.5.3, 0.5.4, 0.5.5, or 0.5.6 (manual OIDC publishing)"
        required: true
        type: string
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-runtime-0.5.0.yml"

permissions:
  contents: write
  id-token: write

concurrency:
  group: bccli-native-051-production
  cancel-in-progress: false

jobs:
  publish:
    if: "${{ (github.event_name == 'workflow_dispatch' && inputs.confirm_version == '0.5.1') || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release(bccli): publish native 0.5.1 to npm')) }}"
    runs-on: ubuntu-latest
    environment: npm-production
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Native source gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-fund
          npm run typecheck
          npm run lint
          npm audit --omit=dev --audit-level=high
          npm run build
          npm test
      - name: Verify clean first-party dependency graph
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const pkg=JSON.parse(readFileSync('package.json','utf8'));
          const lock=JSON.parse(readFileSync('package-lock.json','utf8'));
          if(pkg.name !== '@botconnector/bccli' || pkg.version !== '0.5.1') throw Error('Unexpected package version');
          if(!String(pkg.repository?.url || '').includes('farijarifriyanto-debug/bccli.git')) throw Error('Provenance repository must match trusted publisher');
          const names=[...Object.keys(pkg.dependencies || {}),...Object.keys(pkg.optionalDependencies || {}),...Object.keys(lock.packages || {})];
          const qwen=names.filter(name => name.includes('@qwen-code/'));
          if(qwen.length) throw Error('Forbidden Qwen dependency: ' + qwen.join(', '));
          if(pkg.bin?.bccli !== 'dist/cli.js') throw Error('Unexpected native CLI executable');
          if(pkg.exports?.['.']?.default !== './dist/sdk.js') throw Error('Public SDK missing');
          console.log('PASS: BCCLI native dependencies, CLI and SDK; no Qwen packages');
          JS
      - name: Create immutable production tarball and SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bccli-051-publish"
          npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP/bccli-051-publish" > "$RUNNER_TEMP/bccli-pack.json"
          node -e "const p=require(process.argv[1])[0]; if(p.name!=='@botconnector/bccli'||p.version!=='0.5.1')process.exit(1)" "$RUNNER_TEMP/bccli-pack.json"
          cd "$RUNNER_TEMP/bccli-051-publish"
          sha256sum botconnector-bccli-0.5.1.tgz > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Fresh install and SDK acceptance, without Qwen dependency
        shell: bash
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/bccli-051-install"
          mkdir -p "$DEST"
          npm install --prefix "$DEST" --omit=dev --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/bccli-051-publish/botconnector-bccli-0.5.1.tgz"
          cd "$DEST"
          test "$(./node_modules/.bin/bccli --version)" = '0.5.1'
          node --input-type=module -e "import('@botconnector/bccli').then(m=>{if(typeof m.runTask!=='function'||typeof m.streamTask!=='function')process.exit(1)})"
          test ! -d node_modules/@qwen-code
          ./node_modules/.bin/bccli --help | grep -F 'BCCLI'
          ./node_modules/.bin/bccli provider list | grep -F 'bc-cloud'
          echo 'PASS: fresh installation, model/provider command, SDK, no Qwen modules'
      - name: Refuse to overwrite an existing immutable npm version
        shell: bash
        run: |
          set -euo pipefail
          if npm view @botconnector/bccli@0.5.1 version --json >/dev/null 2>&1; then
            echo 'Version 0.5.1 already exists; refusing to republish.'
            exit 1
          fi
      - name: Publish native BCCLI with GitHub OIDC and matching provenance
        shell: bash
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          set -euo pipefail
          npm install -g npm@latest
          CLEAN_NPMRC="$RUNNER_TEMP/bccli-oidc-only.npmrc"
          printf 'registry=https://registry.npmjs.org/\n' > "$CLEAN_NPMRC"
          export NPM_CONFIG_USERCONFIG="$CLEAN_NPMRC"
          unset NODE_AUTH_TOKEN
          unset NPM_TOKEN
          if test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"; then
            echo 'GitHub OIDC identity missing; refusing to publish'
            exit 1
          fi
          npm publish "$RUNNER_TEMP/bccli-051-publish/botconnector-bccli-0.5.1.tgz" \
            --registry=https://registry.npmjs.org/ --access public --tag latest --ignore-scripts --provenance
      - name: Verify registry latest (allow propagation)
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 24); do
            latest="$(npm view @botconnector/bccli dist-tags.latest --prefer-online 2>/dev/null || true)"
            version="$(npm view @botconnector/bccli@0.5.1 version --prefer-online 2>/dev/null || true)"
            if test "$latest" = "0.5.1" && test "$version" = "0.5.1"; then
              echo 'PASS: @botconnector/bccli@latest and @0.5.1 registered'
              exit 0
            fi
            echo "Waiting for npm registry to expose 0.5.1 ($n/24)"
            sleep 5
          done
          echo 'Registry did not converge on latest=0.5.1'
          exit 1
      - name: Publish GitHub release from the same immutable archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='bccli-v0.5.1'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Stable GitHub tag exists, refusing to overwrite'
            exit 1
          fi
          gh release create "$TAG" \
            "$RUNNER_TEMP/bccli-051-publish/botconnector-bccli-0.5.1.tgz" \
            "$RUNNER_TEMP/bccli-051-publish/SHA256SUMS.txt" \
            --target "$GITHUB_SHA" --title 'BCCLI 0.5.1 Native — clean engine' \
            --notes-file docs/release-bccli-0.5.1.md --latest

  publish_052:
    name: Publish verified 0.5.2 archive via existing npm OIDC
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_version == '0.5.2' }}
    runs-on: ubuntu-latest
    environment: npm-production
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Retrieve immutable archive from verified source release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bccli-052-publish"
          gh release download bccli-v0.5.2 --repo farijarifriyanto-debug/bccli-runtime --dir "$RUNNER_TEMP/bccli-052-publish" --pattern 'botconnector-bccli-0.5.2.tgz' --pattern 'SHA256SUMS.txt'
          test "$(gh release view bccli-v0.5.2 --repo farijarifriyanto-debug/bccli-runtime --json targetCommitish --jq .targetCommitish)" = 'bc4924b0613a759bbd46da414b506b68a2f444ff'
          cd "$RUNNER_TEMP/bccli-052-publish"
          sha256sum -c SHA256SUMS.txt
          actual="$(sha256sum botconnector-bccli-0.5.2.tgz | cut -d ' ' -f 1)"
          test "$actual" = 'a801ea65e710dd5825d2867c0df9ed6e172417214bb64d77a9960e7dae1a3c5e'
          echo "PASS: byte-identical package from bccli-runtime commit bc4924b"
      - name: Align npm repository provenance metadata with existing trusted publisher
        shell: bash
        run: |
          set -euo pipefail
          original="$RUNNER_TEMP/bccli-052-publish/botconnector-bccli-0.5.2.tgz"
          target="$RUNNER_TEMP/bccli-052-publish/botconnector-bccli-0.5.2-oidc.tgz"
          work="$RUNNER_TEMP/bccli-052-provenance"
          mkdir -p "$work/source" "$work/check" "$work/reference"
          tar -xzf "$original" -C "$work/reference"
          tar -xzf "$original" -C "$work/source"
          node --input-type=module - "$work/source/package/package.json" <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path=process.argv[2];
          const pkg=JSON.parse(readFileSync(path,'utf8'));
          if(pkg.name!=='@botconnector/bccli'||pkg.version!=='0.5.2')throw Error('Unexpected release');
          if(!String(pkg.repository?.url||'').includes('farijarifriyanto-debug/bccli-runtime.git'))throw Error('Original source repository differs');
          pkg.repository={type:'git',url:'git+https://github.com/farijarifriyanto-debug/bccli.git'};
          pkg.bccliRuntimeSource={
            repository:'https://github.com/farijarifriyanto-debug/bccli-runtime',
            commit:'bc4924b0613a759bbd46da414b506b68a2f444ff',
            release:'bccli-v0.5.2',
            originalSha256:'a801ea65e710dd5825d2867c0df9ed6e172417214bb64d77a9960e7dae1a3c5e'
          };
          writeFileSync(path,JSON.stringify(pkg,null,2)+'\n');
          JS
          tar -czf "$target" -C "$work/source" package
          tar -xzf "$target" -C "$work/check"
          diff -qr --exclude=package.json "$work/reference/package" "$work/check/package"
          node --input-type=module - "$work/reference/package/package.json" "$work/check/package/package.json" <<'JS'
          import {readFileSync} from 'node:fs';
          import {deepStrictEqual} from 'node:assert';
          const original=JSON.parse(readFileSync(process.argv[2],'utf8'));
          const publish=JSON.parse(readFileSync(process.argv[3],'utf8'));
          if(publish.repository.url!=='git+https://github.com/farijarifriyanto-debug/bccli.git')throw Error('Unexpected publisher origin');
          if(publish.bccliRuntimeSource?.originalSha256!=='a801ea65e710dd5825d2867c0df9ed6e172417214bb64d77a9960e7dae1a3c5e')throw Error('Missing original source integrity metadata');
          delete original.repository;delete publish.repository;delete publish.bccliRuntimeSource;
          deepStrictEqual(publish,original);
          JS
          echo "The only modification versus original GitHub artifact is package.json repository/provenance metadata."
          sha256sum "$target" | tee "$RUNNER_TEMP/bccli-052-publish/npm-payload-SHA256SUMS.txt"
      - name: Verify clean install, SDK, engine, and no separate Qwen dependency
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/bccli-052-publish/botconnector-bccli-0.5.2-oidc.tgz"
          dest="$RUNNER_TEMP/bccli-052-installed"
          mkdir -p "$dest"
          npm install --prefix "$dest" --ignore-scripts --no-audit --no-fund "$file"
          pkg="$dest/node_modules/@botconnector/bccli"
          test -f "$pkg/engine/cli-entry.js"
          test -f "$pkg/web-search-backend.mjs"
          test -f "$pkg/web-search-tool.mjs"
          test -f "$pkg/legacy/dist/sdk.js"
          test ! -d "$dest/node_modules/@qwen-code"
          test "$(node "$pkg/cli.mjs" --version)" = '0.5.2'
          (cd "$dest" && node --input-type=module -e "import('@botconnector/bccli').then(m=>{if(typeof m.runTask!=='function'||typeof m.streamTask!=='function')process.exit(1)})")
          echo "PASS: 0.5.2 clean install and SDK"
      - name: Refuse republish of an existing immutable npm version
        shell: bash
        run: |
          set -euo pipefail
          if npm view @botconnector/bccli@0.5.2 version --prefer-online >/dev/null 2>&1; then
            echo "Version 0.5.2 already exists. Never overwrite immutable npm versions."
            exit 1
          fi
      - name: Publish 0.5.2 through npm trusted publisher (no secret token)
        shell: bash
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          set -euo pipefail
          npm install -g npm@latest
          printf 'registry=https://registry.npmjs.org/\n' > "$RUNNER_TEMP/npm-oidc-only.npmrc"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npm-oidc-only.npmrc"
          unset NODE_AUTH_TOKEN
          unset NPM_TOKEN
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          npm publish "$RUNNER_TEMP/bccli-052-publish/botconnector-bccli-0.5.2-oidc.tgz" --access public --tag latest --ignore-scripts --provenance --registry=https://registry.npmjs.org/
      - name: Verify public npm latest and published integrity
        shell: bash
        run: |
          set -euo pipefail
          expected="sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/bccli-052-publish/botconnector-bccli-0.5.2-oidc.tgz" | openssl base64 -A)"
          # npm accepted the 2026-10-31 publish but its public metadata propagated
          # only after ~13 minutes. Do not republish an immutable version.
          for n in $(seq 1 80); do
            latest="$(npm view @botconnector/bccli dist-tags.latest --prefer-online 2>/dev/null || true)"
            version="$(npm view @botconnector/bccli@0.5.2 version --prefer-online 2>/dev/null || true)"
            if test "$latest" = '0.5.2' && test "$version" = '0.5.2'; then
              echo "PASS: @botconnector/bccli@latest -> 0.5.2"
              actual="$(npm view @botconnector/bccli@0.5.2 dist.integrity --prefer-online)"
              test "$actual" = "$expected"
              echo 'PASS: registry tarball integrity matches the verified provenance-aligned payload'
              exit 0
            fi
            echo "Waiting for npm 0.5.2 metadata propagation ($n/80; 15-second interval)"
            sleep 15
          done
          echo 'npm registry has not converged to 0.5.2 within 20 minutes; do not publish again'
          exit 1

