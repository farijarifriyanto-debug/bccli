name: Publish verified BCCLI 0.5.0 to npm latest

on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: "Type 0.5.0 to approve publishing the immutable verified runtime"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: inputs.confirm_version == '0.5.0'
    runs-on: ubuntu-latest
    environment: npm-production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Download verified GitHub stable artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bccli-publish"
          gh release download 'bccli-v0.5.0' \
            --repo farijarifriyanto-debug/bccli-runtime \
            --pattern 'botconnector-bccli-0.5.0.tgz' \
            --pattern 'SHA256SUMS.txt' \
            --dir "$RUNNER_TEMP/bccli-publish"
          cd "$RUNNER_TEMP/bccli-publish"
          sha256sum -c SHA256SUMS.txt
          tar -xzOf botconnector-bccli-0.5.0.tgz package/package.json > verified-package.json
          node -e "const p=require('./verified-package.json'); if(p.name!=='@botconnector/bccli'||p.version!=='0.5.0'||!p.exports?.['.']?.default?.includes('legacy/dist/sdk.js')||!p.dependencies?.['@qwen-code/qwen-code'])process.exit(1)"
      - name: Refuse existing registry version (immutable)
        shell: bash
        run: |
          set -euo pipefail
          if npm view @botconnector/bccli@0.5.0 version --json >/dev/null 2>&1; then
            echo 'Package 0.5.0 already exists; refusing to publish or retag without verifying provenance.'
            exit 1
          fi
      - name: Install package and import SDK in clean workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bccli-install-test"
          npm install --prefix "$RUNNER_TEMP/bccli-install-test" --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/bccli-publish/botconnector-bccli-0.5.0.tgz"
          cd "$RUNNER_TEMP/bccli-install-test"
          test "$(./node_modules/.bin/bccli --version)" = '0.5.0'
          node --input-type=module -e "import('@botconnector/bccli').then(m => {if(typeof m.runTask!=='function'||typeof m.streamTask!=='function') process.exit(2)})"
      - name: Enable npm 11 for trusted publisher fallback
        shell: bash
        run: npm install -g npm@latest
      - name: Publish identical vetted tarball to npm latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BBCLI }}
        shell: bash
        run: |
          set -euo pipefail
          TAR="$RUNNER_TEMP/bccli-publish/botconnector-bccli-0.5.0.tgz"
          if test -n "${NODE_AUTH_TOKEN:-}"; then
            echo "Checking token identity (never printing token)"
            npm whoami || true
            if npm publish "$TAR" --access public --tag latest --ignore-scripts; then
              echo 'PASS: npm latest published with protected publisher token'
              exit 0
            fi
            echo 'Token publication failed; checking immutable registry state.'
          fi
          if npm view @botconnector/bccli@0.5.0 version --json >/dev/null 2>&1; then
            echo 'Version 0.5.0 exists; do not republish or overwrite.'
            exit 1
          fi
          # OIDC requires an npm Trusted Publisher for this exact repo/workflow.
          # Never try user/password or paste secrets to logs.
          unset NODE_AUTH_TOKEN
          echo 'Trying npm Trusted Publisher OIDC (if configured in npm package settings).'
          npm publish "$TAR" --access public --tag latest --ignore-scripts --provenance
      - name: Verify registry latest
        shell: bash
        run: |
          set -euo pipefail
          for n in 1 2 3 4 5; do
            installed="$(npm view @botconnector/bccli dist-tags.latest 2>/dev/null || true)"
            if test "$installed" = '0.5.0'; then
              echo 'PASS: npm @botconnector/bccli@latest is 0.5.0'
              exit 0
            fi
            sleep 3
          done
          echo 'Registry did not expose expected dist-tag 0.5.0'
          exit 1
